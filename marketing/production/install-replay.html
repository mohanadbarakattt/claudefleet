<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>ClaudeFleet — install replay</title>
<style>
:root{--bg:#0a0a0f;--panel:#12121a;--bar:#1a1a26;--border:#26263a;--text:#e8e8f0;
 --muted:#9a9ab0;--dim:#6b6b80;--accent:#d97748;--green:#4ade80;--blue:#5b9dd9;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:grid;place-items:center;min-height:100vh;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
/* 9:16 stage — record this rectangle */
.stage{width:405px;height:720px;background:var(--bg);position:relative;overflow:hidden;
 display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--border)}
.head{padding:18px 16px 12px;border-bottom:1px solid var(--border);background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:-.3px}
.brand i{width:16px;height:16px;border-radius:4px;background:linear-gradient(145deg,var(--accent),#a8532c);display:block}
.brand span{color:var(--accent)}
.sub{color:var(--dim);font-size:10.5px;margin-top:3px}
.bar{display:flex;gap:5px;padding:9px 14px;background:var(--bar);border-bottom:1px solid var(--border);align-items:center}
.bar i{width:8px;height:8px;border-radius:99px;background:#33334a;display:block}
.bar b{margin-left:8px;color:var(--dim);font-size:10px;font-weight:400;
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.term{flex:1;overflow:hidden;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
 font-size:11.5px;line-height:1.62}
.term .l{white-space:pre-wrap;word-break:break-word}
.cmd{color:var(--text)}.cmd .p{color:var(--accent);font-weight:700}
.out{color:var(--muted)}
.ok{color:var(--green)}
.cur{display:inline-block;width:7px;height:13px;background:var(--accent);
 vertical-align:-2px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.foot{padding:9px 14px;border-top:1px solid var(--border);background:var(--panel);
 display:flex;justify-content:space-between;align-items:center}
.foot span{color:var(--dim);font-size:9.5px}
.ctl{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.ctl button{background:var(--panel);color:var(--text);border:1px solid var(--border);
 padding:7px 15px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit}
.ctl button:hover{border-color:var(--accent)}
@media print{.ctl{display:none}}
</style></head><body>
<div class="stage">
  <div class="head">
    <div class="brand"><i></i>Claude<span>Fleet</span></div>
    <div class="sub">Autopilot Content Machine — install</div>
  </div>
  <div class="bar"><i></i><i></i><i></i><b>zsh — ~/Downloads</b></div>
  <div class="term" id="t"></div>
  <div class="foot">
    <span>replay of a real install — verbatim captured output</span>
    <span id="clk"></span>
  </div>
</div>
<div class="ctl">
  <button onclick="play()">Replay</button>
  <button onclick="play(4)">Replay 4&times;</button>
</div>
<script>
var STEPS = [{"t": "cmd", "v": "unzip -q claudefleet-content-machine.zip && ls -1"}, {"t": "out", "v": "autopilot-content-machine"}, {"t": "out", "v": "claudefleet-content-machine.zip"}, {"t": "cmd", "v": "export FLEET_SRC=\"~/Downloads/autopilot-content-machine\""}, {"t": "cmd", "v": "export MACHINE_DIR=content-machine"}, {"t": "cmd", "v": "export CLAUDEFLEET_HOME=\"~/claudefleet\""}, {"t": "cmd", "v": "ls \"$FLEET_SRC/_engine\""}, {"t": "out", "v": "ENGINE.md"}, {"t": "out", "v": "INSTALL.md"}, {"t": "out", "v": "admin-panel"}, {"t": "out", "v": "hooks"}, {"t": "out", "v": "pipeline.example.json"}, {"t": "cmd", "v": "mkdir -p \"$CLAUDEFLEET_HOME/logs\" \"$CLAUDEFLEET_HOME/$MACHINE_DIR\"/{assets,notes,scripts,briefs,posts,schedule} && echo \"fleet home created\""}, {"t": "out", "v": "fleet home created"}, {"t": "cmd", "v": "cp \"$FLEET_SRC/_engine/pipeline.example.json\" \"$CLAUDEFLEET_HOME/pipeline.json\" && echo \"pipeline.json seeded\""}, {"t": "out", "v": "pipeline.json seeded"}, {"t": "cmd", "v": "ls ~/.claude/agents"}, {"t": "out", "v": "cf-angle-scout.md"}, {"t": "out", "v": "cf-caption-writer.md"}, {"t": "out", "v": "cf-distribution-planner.md"}, {"t": "out", "v": "cf-script-writer.md"}, {"t": "out", "v": "cf-shot-designer.md"}, {"t": "cmd", "v": "ls ~/.claude/skills"}, {"t": "out", "v": "cf-assemble"}, {"t": "out", "v": "cf-ideas"}, {"t": "out", "v": "cf-render"}, {"t": "out", "v": "cf-schedule"}, {"t": "out", "v": "cf-script"}, {"t": "cmd", "v": "cp \"$FLEET_SRC/_engine/admin-panel/index.html\" \"$CLAUDEFLEET_HOME/admin.html\" && echo \"admin panel installed\""}, {"t": "out", "v": "admin panel installed"}, {"t": "cmd", "v": "find \"$CLAUDEFLEET_HOME\" -maxdepth 2 | sed \"s|~|~|\" | sort"}, {"t": "out", "v": "~/claudefleet"}, {"t": "out", "v": "~/claudefleet/admin.html"}, {"t": "out", "v": "~/claudefleet/content-machine"}, {"t": "out", "v": "~/claudefleet/content-machine/assets"}, {"t": "out", "v": "~/claudefleet/content-machine/briefs"}, {"t": "out", "v": "~/claudefleet/content-machine/notes"}, {"t": "out", "v": "~/claudefleet/content-machine/posts"}, {"t": "out", "v": "~/claudefleet/content-machine/schedule"}, {"t": "out", "v": "~/claudefleet/content-machine/scripts"}, {"t": "out", "v": "~/claudefleet/logs"}, {"t": "out", "v": "~/claudefleet/pipeline.json"}, {"t": "cmd", "v": "python3 -m json.tool \"$CLAUDEFLEET_HOME/pipeline.json\" > /dev/null && echo \"pipeline.json: valid JSON\""}, {"t": "out", "v": "pipeline.json: valid JSON"}];
var t=document.getElementById('t'), clk=document.getElementById('clk'), timer=null;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function tick(){var d=new Date();clk.textContent=d.toTimeString().slice(0,8);}
setInterval(tick,1000);tick();
function scroll(){t.scrollTop=t.scrollHeight;}
function play(sp){
  sp=sp||1; if(timer){clearTimeout(timer);timer=null;} t.innerHTML='';
  var i=0;
  function step(){
    if(i>=STEPS.length){t.insertAdjacentHTML('beforeend','<div class="l cmd"><span class="p">$</span> <span class="cur"></span></div>');scroll();return;}
    var s=STEPS[i++];
    if(s.t==='cmd'){
      var el=document.createElement('div'); el.className='l cmd';
      el.innerHTML='<span class="p">$</span> '; t.appendChild(el);
      var txt=s.v, j=0;
      (function type(){
        if(j<txt.length){ el.innerHTML='<span class="p">$</span> '+esc(txt.slice(0,++j))+'<span class="cur"></span>';
          scroll(); timer=setTimeout(type, 22/sp); }
        else { el.innerHTML='<span class="p">$</span> '+esc(txt); scroll(); timer=setTimeout(step, 260/sp); }
      })();
    } else {
      var cls = /valid|created|seeded|installed/.test(s.v) ? 'l out ok' : 'l out';
      t.insertAdjacentHTML('beforeend','<div class="'+cls+'">'+esc(s.v)+'</div>');
      scroll(); timer=setTimeout(step, 46/sp);
    }
  }
  step();
}
play();
</script></body></html>
